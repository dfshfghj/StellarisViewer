<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stellaris 存档查看器</title>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="loading-content">
            <h1>Stellaris 存档查看器</h1>
            <p>选择存档文件以开始</p>
            <label class="file-btn">
                选择 gamestate 文件
                <input type="file" id="file-input" accept="*">
            </label>
            <div id="loading-progress" class="hidden">
                <div class="progress-bar"><div class="progress-fill"></div></div>
                <span id="loading-text">正在解析...</span>
            </div>
        </div>
    </div>

    <!-- Main App -->
    <div id="app" class="hidden">
        <!-- Top Resource Bar -->
        <header id="resource-bar" aria-label="帝国资源栏"></header>

        <!-- Left Sidebar -->
        <div id="sidebar">
            <button class="sidebar-icon" data-action="galaxy" title="银河地图" aria-label="银河地图"><span class="gfx-frame nav-sprite" style="--sprite:url('/gfx/interface/icons/navbar_icons_galaxy.png');--frames:3"></span></button>
            <button class="sidebar-icon" data-action="overview" title="大纲" aria-label="大纲"><span class="gfx-frame nav-sprite" style="--sprite:url('/gfx/interface/icons/navbar_icons_planets_and_sectors.png');--frames:3"></span></button>
            <button class="sidebar-icon" data-action="fleets" title="舰队管理" aria-label="舰队管理"><span class="gfx-frame nav-sprite" style="--sprite:url('/gfx/interface/icons/navbar_icons_fleet_manager.png');--frames:3"></span></button>
            <button class="sidebar-icon" data-action="planets" title="行星与星域" aria-label="行星与星域"><img src="/gfx/interface/icons/menu_icon_planets_and_sectors.png" alt=""></button>
            <button class="sidebar-icon" data-action="research" title="科技" aria-label="科技"><span class="gfx-frame nav-sprite" style="--sprite:url('/gfx/interface/icons/navbar_icons_technology.png');--frames:3"></span></button>
            <span class="sidebar-divider" aria-hidden="true"></span>
            <button class="sidebar-icon" data-action="ship-designer" title="舰船设计器" aria-label="舰船设计器"><span class="gfx-frame nav-sprite" style="--sprite:url('/gfx/interface/icons/navbar_icons_ship_designer.png');--frames:3"></span></button>
        </div>

        <!-- Main Canvas Area -->
        <canvas id="main-canvas"></canvas>

        <!-- Right Overview Panel -->
        <div id="overview-panel" class="hidden"></div>

        <!-- Bottom Status Bar -->
        <div id="status-bar">
            <div class="status-left">
                <span id="status-date"></span>
            </div>
            <div class="status-center">
                <span class="pause-indicator"><span class="pause-glyph">Ⅱ</span> 暂停</span>
                <span id="status-empire"></span>
            </div>
            <div class="status-right">
                <button class="ctrl-btn" id="btn-back" title="返回" aria-label="返回"></button>
            </div>
        </div>

        <!-- Fleet Window (popup) -->
        <div id="fleet-window" class="popup-window hidden"></div>

        <!-- Ship Detail Window (popup) -->
        <div id="ship-window" class="popup-window hidden"></div>

        <!-- Planet Window (full screen) -->
        <div id="planet-window" class="hidden"></div>

        <!-- Standard popup.gui / standard_dialog.gui inspired modal host -->
        <div id="modal-layer" class="modal-layer hidden" aria-hidden="true"></div>
    </div>

    <script type="module" src="/main.js"></script>
</body>
</html>
