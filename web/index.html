<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stellaris Save Viewer</title>
</head>
<body>
    <button id="language-toggle" class="language-toggle" type="button" data-i18n-title="app.switchLanguage">
        <span data-i18n="app.switchLanguageShort">中文</span>
    </button>
    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="loading-content">
            <h1 data-i18n="app.title">Stellaris Save Viewer</h1>
            <p data-i18n="app.chooseSave">Choose a save file to begin</p>
            <label class="file-btn">
                <span data-i18n="app.chooseFile">Choose gamestate file</span>
                <input type="file" id="file-input" accept="*">
            </label>
            <div id="loading-progress" class="hidden">
                <div class="progress-bar"><div class="progress-fill"></div></div>
                <span id="loading-text" data-i18n="loading.parsing">Parsing...</span>
            </div>
        </div>
    </div>

    <!-- Main App -->
    <div id="app" class="hidden">
        <!-- Main Canvas Area (intentionally outside the scaled game UI) -->
        <canvas id="main-canvas"></canvas>

        <div id="game-ui-layer">
        <!-- Top Resource Bar -->
        <header id="resource-bar" data-i18n-title="nav.resources" aria-label="Empire resources"></header>

        <!-- Left Sidebar -->
        <div id="sidebar">
            <button class="sidebar-icon" data-action="galaxy" data-i18n-title="nav.galaxy" title="Galaxy map" aria-label="Galaxy map"><span class="gfx-frame nav-sprite" style="--sprite:url('/gfx/interface/icons/navbar_icons_galaxy.webp');--frames:3"></span></button>
            <button class="sidebar-icon" data-action="overview" data-i18n-title="nav.overview" title="Outliner" aria-label="Outliner"><span class="gfx-frame nav-sprite" style="--sprite:url('/gfx/interface/icons/navbar_icons_planets_and_sectors.webp');--frames:3"></span></button>
            <button class="sidebar-icon" data-action="fleets" data-i18n-title="nav.fleets" title="Fleet manager" aria-label="Fleet manager"><span class="gfx-frame nav-sprite" style="--sprite:url('/gfx/interface/icons/navbar_icons_fleet_manager.webp');--frames:3"></span></button>
            <button class="sidebar-icon" data-action="planets" data-i18n-title="nav.planets" title="Planets and sectors" aria-label="Planets and sectors"><img src="/gfx/interface/icons/menu_icon_planets_and_sectors.webp" alt=""></button>
            <button class="sidebar-icon" data-action="research" data-i18n-title="nav.research" title="Technology" aria-label="Technology"><span class="gfx-frame nav-sprite" style="--sprite:url('/gfx/interface/icons/navbar_icons_technology.webp');--frames:3"></span></button>
            <span class="sidebar-divider" aria-hidden="true"></span>
            <button class="sidebar-icon" data-action="ship-designer" data-i18n-title="nav.shipDesigner" title="Ship designer" aria-label="Ship designer"><span class="gfx-frame nav-sprite" style="--sprite:url('/gfx/interface/icons/navbar_icons_ship_designer.webp');--frames:3"></span></button>
        </div>

        <!-- Right Overview Panel -->
        <div id="overview-panel" class="hidden"></div>

        <!-- Bottom Status Bar -->
        <div id="status-bar">
            <div class="status-left">
                <span id="status-date"></span>
            </div>
            <div class="status-center">
                <span class="pause-indicator"><span class="pause-glyph">Ⅱ</span> <span data-i18n="status.paused">Paused</span></span>
                <span id="status-empire"></span>
            </div>
            <div class="status-right">
                <button class="ctrl-btn" id="btn-back" data-i18n-title="nav.back" title="Back" aria-label="Back"></button>
            </div>
        </div>

        <!-- Fleet Window (popup) -->
        <div id="fleet-window" class="popup-window hidden"></div>

        <!-- Ship Detail Window (popup) -->
        <div id="ship-window" class="popup-window hidden"></div>

        <!-- Planet Window (full screen) -->
        <div id="planet-window" class="hidden"></div>

        <!-- Standard popup.gui / standard_dialog.gui inspired modal host -->
        <div id="modal-layer" class="modal-layer hidden" aria-hidden="true"></div>
        </div>
    </div>

    <script type="module" src="/main.js"></script>
</body>
</html>
